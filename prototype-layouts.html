<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOXCHAIN — Simple view layout prototype (THROWAWAY)</title>
  <!--
    ===================================================================
    THROWAWAY UI PROTOTYPE — wayfinder #45, "[Prototype] Simple view
    layout". Not production code; no tests; nothing links here. When
    the layout decision is folded into the real Simple view (#46–#49),
    this file is deleted (its content lives on in git history and in
    the spec the decision produced).

    QUESTION (#45): where do the card library, plain filters, Current
    sound + Previous/Next, the effect summary, and the safety floor
    sit — on desktop and on mobile — inside the existing
    split-collapsible-panel shell? The map's decisions (#43) are
    settled and are NOT re-litigated here; only arrangement varies.

    PLAN (prototype skill, UI branch): three structurally different
    arrangements of the same settled elements, on ONE throwaway page
    that reuses the REAL stylesheet (styles/main.css) and the REAL
    factory library (src/factory-library-data.js) so density and
    vocabulary match production. Switch via the floating bottom bar,
    the ←/→ keys, or ?variant=A|B|C|all; viewport via ?vp=desktop|
    mobile (auto-mobile under 900px, mirroring the app's own
    breakpoint). `all` shows the three side by side (static).

      A — Sidebar library · sound stage   (library takes the presets
          sidebar; Current sound takes the board's spot, meters keep
          framing it above/below)
      B — Now-playing band                (Current sound is a full-width
          band under the system deck carrying the meters; the library
          fills the rest as a card grid)
      C — Library page · bottom dock      (the library IS the page;
          Current sound docks to the bottom, summary on demand)

    Interactions are real but in-memory only: filters filter, search
    searches, cards try, Previous/Next step the filtered factory list,
    and the bar's state keys force the three Current sound states
    (preset / unsaved / custom) so "Save this sound" placement can be
    judged in each arrangement. Nothing persists across reload.

    Mock content is clearly marked below: filter-filler factory
    presets (the real 6 would give every chip exactly one result —
    useless for judging stepping), two user presets, and the plain
    effect phrases (placeholder vocabulary pending #44/#46).
    ===================================================================
  -->
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* =================================================================
       PROTOTYPE-ONLY STYLES. Everything reuses --pm-* tokens and the
       shared key/panel/strip classes from main.css; only the Simple
       view's own arrangement geometry lives here (sd- = simple draft,
       px- = prototype chrome). Delete this whole file with the
       prototype.
       ================================================================= */

    /* --- mode plumbing ------------------------------------------------ */

    /* `all` mode needs page scroll; main.css's fixed-console rule
       (html,body{overflow:hidden} at >=901px) would trap the three
       side-by-side shells off-viewport. */
    html.px-all,
    html.px-all body {
      height: auto;
      overflow: auto;
    }

    /* Mobile reading: applied by JS when vp=mobile OR the real
       viewport is under 900px (the app's own breakpoint), so the file
       also works opened directly on a phone. */
    .px-frame {
      width: 390px;
      max-width: 100%;
      height: min(844px, calc(100vh - 130px));
      min-height: 480px;
      margin: 1rem auto;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid var(--pm-face-edge);
      background: var(--pm-bench);
    }

    .px-frame .instrument {
      /* cancel the fixed-console + bleed geometry inside the frame */
      height: auto;
      min-height: 100%;
      margin: 0;
    }

    /* --- the floating switcher (obviously NOT part of the design) ---- */

    .px-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      max-width: calc(100vw - 24px);
      padding: 0.45rem 0.6rem;
      border: 2px dashed var(--pm-accent);
      border-radius: 8px;
      background: var(--pm-chassis);
      color: var(--pm-print-hi);
      font-size: 0.78rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    .px-bar button {
      padding: 0.3rem 0.55rem;
      border: 1px solid var(--pm-key-edge);
      border-radius: 4px;
      background: var(--pm-key);
      color: var(--pm-print-hi);
      font: inherit;
      cursor: pointer;
    }

    .px-bar button:hover {
      border-color: var(--pm-print);
    }

    .px-bar button.px-on {
      background: var(--pm-accent);
      border-color: var(--pm-accent);
      color: var(--pm-ink);
      font-weight: 700;
    }

    .px-bar-title {
      min-width: 13rem;
      text-align: center;
      white-space: nowrap;
    }

    .px-bar-title b {
      color: var(--pm-accent);
    }

    .px-bar-note {
      max-width: 22rem;
      overflow: hidden;
      color: var(--pm-print-dim);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .px-bar-sep {
      width: 1px;
      align-self: stretch;
      background: var(--pm-key-edge);
    }

    /* The floating bar gets the bottom 76px of the bench for itself —
       the instrument floats above it. Without this, variant C's dock
       (and A's transport) hide under the bar in the fixed-console
       reading, which is exactly what the prototype exists to judge. */
    @media (min-width: 901px) {
      html:not(.px-all) .instrument {
        height: calc(100vh - 76px);
        margin-bottom: 76px;
      }
    }

    .px-allrow {
      padding-bottom: 90px;
    }

    /* --- shared shell bits -------------------------------------------- */

    /* The Simple|Advanced segmented key (the view switch itself is
       #47's task; here it only needs to visibly exist in the deck). */
    .px-viewswitch {
      display: flex;
      margin-left: 0.9rem;
    }

    .px-vs-key {
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--pm-key-edge);
      background: var(--pm-key);
      color: var(--pm-print);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .px-vs-key + .px-vs-key {
      border-left: none;
    }

    .px-vs-key.px-vs-on {
      background: var(--pm-accent);
      border-color: var(--pm-accent);
      color: var(--pm-ink);
    }

    /* Plain filter chips — pad grammar: keys, the active one lit in
       the accent fill (the one bright thing in the group). */
    .px-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }

    .px-chip {
      padding: 0.34rem 0.8rem;
      border: 1px solid var(--pm-key-edge);
      border-radius: 999px;
      background: var(--pm-key);
      color: var(--pm-print-hi);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .px-chip:hover {
      border-color: var(--pm-print);
    }

    .px-chip.px-on {
      background: var(--pm-accent);
      border-color: var(--pm-accent);
      color: var(--pm-ink);
      font-weight: 700;
    }

    .px-count {
      align-self: center;
      margin-left: 0.3rem;
      color: var(--pm-print-dim);
      font-size: 0.72rem;
      font-family: var(--font-readout);
      white-space: nowrap;
    }

    /* Cards — slab castings on the faceplate, like the chain sections:
       never a floating card, groove-cut edges, no rest shadow. */
    .px-cards {
      display: grid;
      gap: 0.5rem;
    }

    .px-cards-grid {
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      align-content: start;
    }

    .px-card {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--pm-groove-cut);
      box-shadow: inset 0 1px 0 var(--pm-slab-lip);
      background: var(--pm-slab);
    }

    .px-card.px-card-active {
      border-color: var(--pm-accent);
      box-shadow: inset 3px 0 0 var(--pm-accent), inset 0 1px 0 var(--pm-slab-lip);
    }

    .px-card-load {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.55rem 0.7rem;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .px-card-load:hover .px-card-name {
      color: var(--pm-accent-hi);
    }

    .px-card-name {
      color: var(--pm-print-hi);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .px-card-desc {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      color: var(--pm-print-dim);
      font-size: 0.75rem;
      line-height: 1.35;
    }

    .px-card-tags {
      color: var(--pm-print-dim);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: lowercase;
    }

    /* Yours-only secondary menu (Delete & future transfers live here,
       never competing with trying the preset — settled #43). */
    .px-card-menu {
      flex: none;
      align-self: stretch;
      width: 2rem;
      border: none;
      border-left: 1px solid var(--pm-groove-cut);
      background: transparent;
      color: var(--pm-print-dim);
      cursor: pointer;
    }

    .px-card-menu:hover {
      color: var(--pm-print-hi);
    }

    .px-group {
      margin: 0.9rem 0 0.35rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--pm-print);
    }

    .px-cards .px-group {
      grid-column: 1 / -1;
    }

    .px-group:first-child {
      margin-top: 0;
    }

    .px-empty {
      grid-column: 1 / -1;
      padding: 0.7rem 0.6rem;
      border: 1px dashed var(--pm-key-edge);
      color: var(--pm-print-dim);
      font-size: 0.78rem;
    }

    /* --- Current sound shared bits ------------------------------------ */

    .px-kicker {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--pm-print);
    }

    .px-cs-name {
      color: var(--pm-print-hi);
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .px-cs-state {
      color: var(--pm-accent);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .px-save {
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--pm-accent);
      border-radius: 4px;
      background: var(--pm-key);
      color: var(--pm-accent-hi);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .px-save:hover {
      background: var(--pm-accent);
      color: var(--pm-ink);
    }

    /* Effect summary — the plain phrase leads, the technical name
       trails quietly after ("Evens out loudness · Compressor").
       Read-only, no values (settled #43). Owner direction, 2026-09-01
       ("for fun"): the technical name prints in its family's ink
       (--famPrint, set per row from the same --pm-family-* tokens the
       board's rail print uses).

       This pass folds the standalone device strip INTO these rows
       instead of stacking both: the previous version showed the same
       5-ish technical names twice in one screen — once as bold pills
       right above this list, once again a few lines down as the quiet
       trailing label — which is clutter, not clarity, for a first-run
       non-engineer, and it gave the technical name top billing right
       next to the very list built to keep it quiet. Each row now
       carries its own family-color legend swatch (the device strip's
       exact visual — a colored square) at the LEFT of the plain
       phrase, so "what device is this" reads at a glance without a
       second list saying the same names again. */
    .px-summary {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .px-summary li {
      padding: 0.22rem 0;
      border-bottom: 1px solid var(--pm-groove-cut);
      font-size: 0.92rem;
      color: var(--pm-print-hi);
    }

    .px-summary li:last-child {
      border-bottom: none;
    }

    .px-summary-rich li {
      display: flex;
      align-items: baseline;
      gap: 0.65rem;
      padding: 0.5rem 0.1rem;
      border-bottom: 1px solid var(--pm-groove-cut);
      font-size: 1rem;
    }

    .px-summary-rich li:last-child {
      border-bottom: none;
    }

    .px-summary-legend {
      flex: none;
      align-self: center;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--fam, var(--pm-print-dim));
    }

    .px-plain {
      flex: 1 1 auto;
    }

    .px-tech {
      flex: none;
      color: var(--famPrint, var(--pm-print));
      font-family: var(--font-readout);
      font-size: 0.75rem;
      letter-spacing: 0.03em;
    }

    .px-summary-rich .px-tech {
      margin-left: 0.55rem;
    }

    .px-transport {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .px-transport .control {
      font-weight: 700;
    }

    .px-pos {
      min-width: 4ch;
      color: var(--pm-print-dim);
      font-family: var(--font-readout);
      font-size: 0.8rem;
      text-align: center;
    }

    /* Mini meters (variants B/C): the real .canvas-footer unit at its
       natural 96px canvas width, packed tighter inside a band/dock. */
    .px-meters {
      display: flex;
      gap: 0.7rem;
    }

    .px-meters .canvas-footer {
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--pm-groove-cut);
    }

    .px-meter {
      display: block;
      width: 96px;
      height: 26px;
    }

    html.px-bypassed .px-meter {
      opacity: 0.35;
    }

    /* --- variant A: sidebar library · sound stage --------------------- */

    .px-shellA {
      flex-direction: row;
    }

    .px-shellA .px-lib {
      flex: 0 0 320px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--pm-groove-cut);
      box-shadow: inset -1px 0 0 var(--pm-groove-lip);
      background: var(--pm-system-deck);
    }

    .px-shellA .px-lib-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }

    .px-shellA .px-cards {
      grid-template-columns: 1fr;
    }

    .px-faceA {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .px-stage {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.1rem 1.6rem;
      background: var(--pm-chassis);
    }

    /* The stage's composed column: capped to a reading measure and
       centered — the stage fills the board's seat, but its content
       keeps a page-like measure instead of smearing across 900px of
       chassis. Owner direction, 2026-09-01: the bare name + list left
       the old chain area feeling empty, so the stage carries the
       preset's own description above the effect summary. A follow-up
       pass folded the standalone device strip that first answered that
       into the summary rows themselves (see .px-summary-rich above) —
       same family-color legend, once instead of twice. */
    .px-stage-inner {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .px-stage-head {
      display: flex;
      align-items: baseline;
      gap: 0.9rem;
      flex-wrap: wrap;
    }

    .px-stage-head .px-cs-name {
      flex: 1 1 auto;
      min-width: 12rem;
      font-size: 1.7rem;
    }

    .px-desc {
      margin: -0.35rem 0 0;
      color: var(--pm-print);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .px-stage .px-transport {
      justify-content: center;
      padding-top: 0.7rem;
      border-top: 1px solid var(--pm-groove-cut);
    }

    /* --- variant B: now-playing band ---------------------------------- */

    .px-shellB {
      flex-direction: column;
    }

    .px-band {
      flex: none;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--pm-groove-cut);
      box-shadow: inset 0 -1px 0 var(--pm-groove-lip);
      background: var(--pm-system-deck);
    }

    .px-band-info {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .px-band-name-row {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .px-band .px-cs-name {
      font-size: 1.15rem;
    }

    .px-band-summary {
      overflow: hidden;
      color: var(--pm-print);
      font-size: 0.82rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .px-band-more {
      display: none;
    }

    .px-band.px-expanded .px-band-more {
      display: block;
      margin-top: 0.4rem;
    }

    .px-band-more .px-summary li {
      display: inline-block;
      border-bottom: none;
      padding: 0.1rem 0;
      font-size: 0.85rem;
    }

    .px-band-more .px-summary li + li::before {
      content: '·';
      margin: 0 0.45rem;
      color: var(--pm-print-dim);
    }

    .px-libzone {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--pm-chassis);
    }

    .px-libzone .px-lib-toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .px-libzone .preset-search {
      flex: 0 1 13rem;
      position: static;
    }

    .px-libzone .px-cards {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }

    /* --- variant C: library page · bottom dock ------------------------ */

    .px-shellC {
      flex-direction: column;
    }

    .px-libpage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--pm-chassis);
    }

    .px-libpage .px-lib-toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .px-libpage .preset-search {
      flex: 0 1 13rem;
      position: static;
    }

    .px-libpage .px-cards {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }

    .px-dock {
      flex: none;
      position: sticky;
      bottom: 0;
      padding: 0.6rem 1rem;
      border-top: 1px solid var(--pm-groove-cut);
      box-shadow: inset 0 1px 0 var(--pm-groove-lip), 0 -6px 14px rgba(0, 0, 0, 0.35);
      background: var(--pm-system-deck);
    }

    .px-dock-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .px-dock-info {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .px-dock .px-cs-name {
      font-size: 1.05rem;
    }

    .px-dock-more {
      display: none;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--pm-groove-cut);
    }

    .px-dock.px-expanded .px-dock-more {
      display: block;
    }

    .px-dock-expand {
      flex: none;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--pm-key-edge);
      border-radius: 4px;
      background: var(--pm-key);
      color: var(--pm-print-hi);
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* --- mobile reading (html.px-mob), mirroring the app's own <901px
           stacking discipline: zones stack, the page keeps its scroll,
           the deck stays sticky at top --------------------------------- */

    html.px-mob .px-shellA,
    html.px-mob .px-shellB,
    html.px-mob .px-shellC {
      flex-direction: column;
    }

    html.px-mob .px-shellA .px-lib {
      order: 2;
      flex: none;
      border-right: none;
      border-top: 1px solid var(--pm-groove-cut);
      box-shadow: inset 0 1px 0 var(--pm-groove-lip);
    }

    html.px-mob .px-shellA .px-lib-body {
      overflow: visible;
    }

    /* The real fix for a bug that shipped in the previous pass: .px-faceA
       carries an UNSCOPED `flex: 1 1 auto; min-height: 0;` (below, "variant
       A" block) so it can stretch to fill the board's seat on desktop. But
       this file's mobile preview is a scaled-down `.px-frame` sitting
       INSIDE a real desktop-width page — the real viewport never actually
       drops under 901px, so main.css's own `@media(min-width:901px)`
       height-bounded console chain (`.instrument{height:100vh}` down
       through `.layout.voice-deck{flex:1 1 auto;min-height:0}`) stays
       genuinely active the whole time. .px-lib is already given `flex:
       none` below so it sits at its natural (tall) content height; without
       a matching override .px-faceA stayed shrinkable with min-height:0
       against that same bounded ancestor, so flexbox handed it 100% of the
       overflow and it collapsed to 0px — invisible meters, invisible
       Current sound, invisible Save. `flex: none` here mirrors .px-lib's
       treatment: content height, unshrinkable, verified non-zero below. */
    html.px-mob .px-faceA {
      order: 1;
      flex: none;
    }

    html.px-mob .px-stage {
      overflow: visible;
    }

    html.px-mob .px-cards-grid {
      grid-template-columns: 1fr;
    }

    html.px-mob .px-band {
      flex-wrap: wrap;
      gap: 0.5rem 0.9rem;
    }

    html.px-mob .px-band .px-meters {
      order: 5;
    }

    html.px-mob .px-libzone .px-lib-toolbar,
    html.px-mob .px-libpage .px-lib-toolbar {
      flex-wrap: wrap;
    }

    html.px-mob .px-libzone .preset-search,
    html.px-mob .px-libpage .preset-search {
      flex: 1 1 100%;
    }

    html.px-mob .px-libzone .px-cards,
    html.px-mob .px-libpage .px-cards {
      overflow: visible;
    }

    html.px-mob .px-bar {
      flex-wrap: wrap;
      justify-content: center;
    }

    html.px-mob .px-bar-title {
      min-width: 0;
    }

    html.px-mob .px-bar-note {
      display: none;
    }

    /* --- `all` mode ---------------------------------------------------- */

    .px-allrow {
      display: flex;
      gap: 1.2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 1rem;
    }

    .px-allcard {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .px-allcard-label {
      color: var(--pm-print-hi);
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
    }

    .px-allcard-label b {
      color: var(--pm-accent);
    }

    .px-allcard .px-scaled {
      width: 1440px;
      height: 900px;
      transform: scale(0.46);
      transform-origin: top left;
      pointer-events: none;
    }

    .px-allcard .px-scaled .instrument {
      height: 900px;
    }

    .px-allcard.px-allmob .px-scaled {
      width: 390px;
      height: 780px;
      transform: scale(0.92);
    }

    .px-allcard.px-allmob .px-scaled .instrument {
      height: 780px;
    }
  </style>
</head>
<body>
  <!--
    Everything below is rendered by the prototype script into #px-root;
    the floating bar is JS-built too. No production markup is touched —
    this file is standalone by design (the real index.html is the
    Advanced view's home and stays exactly as it is).
  -->
  <div id="px-root"></div>

  <script src="src/factory-library-data.js"></script>
  <script>
  (function () {
    'use strict';

    // ------------------------------------------------------------------
    // CONTENT — the real factory library plus clearly-marked mock
    // filler. The real six presets give every plain chip exactly ONE
    // result (the library is young — #26's coverage work), which is
    // useless for judging Previous/Next stepping, so this prototype
    // pads the shelves. Mocks would never ship: they carry no
    // provenance and were never auditioned.
    // ------------------------------------------------------------------

    var MOCK_PRESETS = [
      { name: 'Jukebox Warm', description: 'Laid-back warmth with a light slap — country and soul sets.', tags: ['use-case:performance', 'genre:Country', 'vibe:warm'], nodes: [ { type: 'eq' }, { type: 'compressor' }, { type: 'delay' }, { type: 'limiter' } ], mock: true },
      { name: 'Arena Rock', description: 'Loud, bright, and dry — built to cut through guitars.', tags: ['use-case:performance', 'genre:Rock', 'vibe:epic/big'], nodes: [ { type: 'gain' }, { type: 'eq' }, { type: 'compressor' }, { type: 'distortion' }, { type: 'limiter' } ], mock: true },
      { name: 'Robot Talk', description: 'The classic robot voice — steady pitch, metal edges.', tags: ['gag:robot', 'use-case:performance'], nodes: [ { type: 'autotune' }, { type: 'eq' }, { type: 'distortion' }, { type: 'limiter' } ], mock: true },
      { name: 'Chipmunk Party', description: 'Everything up an octave — the birthday-party bit.', tags: ['gag:chipmunk', 'use-case:performance'], nodes: [ { type: 'pitchshift' }, { type: 'compressor' }, { type: 'limiter' } ], mock: true },
      { name: 'Podcast Cleanup', description: 'Hiss tamed, plosives softened, voice forward — for talking, not singing.', tags: ['use-case:speech/hosting', 'use-case:cleanup'], nodes: [ { type: 'gate' }, { type: 'eq' }, { type: 'compressor' }, { type: 'limiter' } ], mock: true },
      { name: 'Intimate Jazz', description: 'Close, natural, barely touched — small-room standards.', tags: ['use-case:performance', 'genre:Jazz', 'vibe:intimate'], nodes: [ { type: 'eq' }, { type: 'compressor' }, { type: 'reverb' }, { type: 'limiter' } ], mock: true }
    ];

    var FACTORY = window.FACTORY_LIBRARY.PRESETS.concat(MOCK_PRESETS);

    var USERS = [
      { name: 'My Stage Set', description: 'Saved from a Warm Ballad with a touch more echo.', user: true },
      { name: 'Sunday Hosting', description: 'Clean speech with the gate a little tighter.', user: true }
    ];

    // PLACEHOLDER plain-language phrases, one per node type — the real
    // labels are #44's research and #46's catalog work. Prototype copy
    // only; do not treat as decided vocabulary.
    var PLAIN_LABELS = {
      gain: 'Sets the volume',
      compressor: 'Evens out loudness',
      eq: 'Shapes the tone',
      delay: 'Adds echoes',
      reverb: 'Adds room sound',
      limiter: 'Caps the loudest peaks',
      gate: 'Cuts background noise',
      autotune: 'Tunes the notes to the key',
      distortion: 'Adds grit and edge',
      chorus: 'Thickens and widens',
      tremolo: 'Adds a wobble',
      phaser: 'Adds a sweeping whoosh',
      pitchshift: 'Shifts the voice up or down',
      bitcrusher: 'Makes it sound lo-fi'
    };

    // The agent-built demo chain for the Custom sound state (an agent
    // built this while the user sat in Simple — the map's exact scene).
    var CUSTOM_CHAIN = [
      { type: 'gate' }, { type: 'autotune' }, { type: 'eq' },
      { type: 'delay' }, { type: 'reverb' }, { type: 'limiter' }
    ];

    // Plain filters — named queries over existing tags, defined HERE
    // and stored nowhere on presets (settled #43). A chip that returns
    // nothing is a visible coverage gap, rendered as such below.
    var PLAIN_FILTERS = [
      { id: 'all', label: 'All', test: function () { return true; } },
      { id: 'warm', label: 'Warm', test: function (t) { return t.indexOf('vibe:warm') >= 0; } },
      { id: 'rock', label: 'Rock', test: function (t) { return t.indexOf('genre:Rock') >= 0; } },
      { id: 'funny', label: 'Funny', test: function (t) { return t.some(function (x) { return x.indexOf('gag:') === 0; }); } },
      { id: 'speech', label: 'Speech', test: function (t) { return t.indexOf('use-case:speech/hosting') >= 0; } }
    ];

    var VARIANTS = [
      { id: 'A', name: 'Sidebar library · sound stage' },
      { id: 'B', name: 'Now-playing band' },
      { id: 'C', name: 'Library page · bottom dock' }
    ];

    // ------------------------------------------------------------------
    // STATE — in memory only. Reload resets everything (prototype
    // discipline: persistence is what production proves, not what the
    // throwaway assumes).
    // ------------------------------------------------------------------

    var state = {
      variant: 'A',
      vp: 'desktop',
      filter: 'all',
      query: '',
      current: FACTORY[1],           // Warm Ballad
      sound: 'preset',               // 'preset' | 'unsaved' | 'custom'
      bypass: false,
      expanded: false,               // B band / C dock summary
      savedCount: 0
    };

    function filterDef() {
      return PLAIN_FILTERS.filter(function (f) { return f.id === state.filter; })[0];
    }

    function filteredFactory() {
      var q = state.query.trim().toLowerCase();
      return FACTORY.filter(function (p) {
        if (!filterDef().test(p.tags)) return false;
        if (q && (p.name + ' ' + p.description).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
    }

    function currentName() {
      if (state.sound === 'custom') return 'Custom sound';
      return state.current ? state.current.name : '—';
    }

    function currentChain() {
      if (state.sound === 'custom') return CUSTOM_CHAIN;
      return state.current ? state.current.nodes : [];
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // ------------------------------------------------------------------
    // SHARED RENDER PIECES
    // ------------------------------------------------------------------

    function systemDeck() {
      return '' +
        '<header class="topbar system-deck">' +
          '<div class="topbar-section topbar-identity">' +
            '<h1 class="app-title">VOXCHAIN</h1>' +
            '<div class="px-viewswitch">' +
              '<button type="button" class="px-vs-key px-vs-on" data-action="noop">Simple</button>' +
              '<button type="button" class="px-vs-key" data-action="advanced" title="View switching is #47\'s task — this prototype only arranges Simple">Advanced</button>' +
            '</div>' +
          '</div>' +
          '<div class="system-etch">' +
            '<div class="topbar-section topbar-status">' +
              '<span class="status live" id="status" role="status">' +
                '<span class="dot" id="status-dot"></span><span id="status-text">Live</span>' +
              '</span>' +
            '</div>' +
            '<div class="readout-group" role="group" aria-label="Engine readouts">' +
              '<span class="readout"><span class="readout-label">RATE</span><span class="readout-value">48.0 kHz</span></span>' +
              '<span class="readout"><span class="readout-label">LAT</span><span class="readout-value">25.6 ms</span></span>' +
              '<span class="readout"><span class="readout-label">NODES</span><span class="readout-value">' + currentChain().length + '</span></span>' +
            '</div>' +
          '</div>' +
          '<div class="topbar-section topbar-controls">' +
            '<button id="start-button" class="control" type="button" disabled>Start</button>' +
            '<label for="input-device-select" class="sr-only">Input device:</label>' +
            '<select id="input-device-select" class="control">' +
              '<option>Shure SM58 (USB)</option>' +
              '<option>MacBook Pro Microphone</option>' +
            '</select>' +
          '</div>' +
          '<button id="bypass-toggle-button" class="bypass-btn' + (state.bypass ? ' engaged' : '') + '" type="button">Bypass: ' + (state.bypass ? 'ON' : 'OFF') + '</button>' +
        '</header>';
    }

    function shellOpen() {
      return '<div class="instrument">' + systemDeck() + '<div class="deck-seam" aria-hidden="true"></div>';
    }

    function chipsRow(withCount) {
      var list = filteredFactory();
      var html = '<div class="px-chips" role="group" aria-label="Plain filters">';
      PLAIN_FILTERS.forEach(function (f) {
        html += '<button type="button" class="px-chip' + (state.filter === f.id ? ' px-on' : '') + '" data-action="chip" data-id="' + f.id + '">' + f.label + '</button>';
      });
      if (withCount) {
        html += '<span class="px-count">' + list.length + ' of ' + FACTORY.length + '</span>';
      }
      return html + '</div>';
    }

    function searchInput() {
      return '<label for="px-search" class="sr-only">Search sounds</label>' +
        '<input type="text" id="px-search" class="control preset-search" placeholder="Search sounds…" autocomplete="off" value="' + esc(state.query) + '">';
    }

    function cardFor(p, i) {
      var active = state.sound !== 'custom' && state.current && state.current.name === p.name;
      var tags = p.tags ? p.tags.filter(function (t) { return t.indexOf('technique:') !== 0; })
        .map(function (t) { return t.split(':')[1]; }).join(' · ') : '';
      var html = '<div class="px-card' + (active ? ' px-card-active' : '') + '">';
      html += '<button type="button" class="px-card-load" data-action="try" data-i="' + i + '">' +
        '<span class="px-card-name">' + esc(p.name) + '</span>' +
        '<span class="px-card-desc">' + esc(p.description || '') + '</span>' +
        (tags ? '<span class="px-card-tags">' + esc(tags) + '</span>' : '') +
        '</button>';
      if (p.user) {
        html += '<button type="button" class="px-card-menu" title="Delete and other actions (settled: secondary menu)" data-action="noop">⋯</button>';
      }
      return html + '</div>';
    }

    function cardsGrid() {
      var list = filteredFactory();
      var html = '<div class="px-cards px-cards-grid">';
      html += '<div class="px-group">Factory</div>';
      if (list.length === 0) {
        html += '<div class="px-empty">No factory sounds match — a coverage gap for the library to fill, not a Simple-view bug.</div>';
      } else {
        list.forEach(function (p) { html += cardFor(p, FACTORY.indexOf(p)); });
      }
      var q = state.query.trim().toLowerCase();
      var users = q ? USERS.filter(function (u) { return (u.name + ' ' + (u.description || '')).toLowerCase().indexOf(q) >= 0; }) : USERS;
      html += '<div class="px-group">Yours</div>';
      if (users.length === 0) {
        html += '<div class="px-empty">Nothing of yours matches that search.</div>';
      } else {
        users.forEach(function (u) { html += cardFor(u, -1); });
      }
      return html + '</div>';
    }

    function familyVars(type) {
      // Per-row family hooks: --fam (saturated, legend squares/ticks) and
      // --famPrint (the desaturated print ink the board's rail uses for
      // text). Unknown types fall back through the CSS var() defaults.
      return '--fam:var(--family-' + type + ');--famPrint:var(--pm-family-' + type + ')';
    }

    // The technical name as it prints quietly after the plain phrase
    // (e.g. "Noise Gate", not "gate") — the only place a device's name
    // now appears; the previous pass's separate device-strip pills
    // duplicated this same lookup one screen-region higher.
    function deviceName(type) {
      var names = {
        gain: 'Gain', compressor: 'Compressor', eq: 'EQ', delay: 'Delay',
        reverb: 'Reverb', limiter: 'Limiter', gate: 'Noise Gate',
        autotune: 'Autotune', distortion: 'Distortion', chorus: 'Chorus',
        tremolo: 'Tremolo', phaser: 'Phaser', pitchshift: 'Pitch Shift',
        bitcrusher: 'Bitcrusher'
      };
      return names[type] || type;
    }

    function currentDescription() {
      if (state.sound === 'custom') {
        return 'Assembled by your agent just now — listen, and keep it with Save this sound if you like it.';
      }
      return state.current && state.current.description ? state.current.description : '';
    }

    function summaryList(chain, rich) {
      var html = '<ol class="px-summary' + (rich ? ' px-summary-rich' : '') + '">';
      chain.forEach(function (n) {
        html += '<li style="' + familyVars(n.type) + '">' +
          (rich ? '<span class="px-summary-legend" aria-hidden="true"></span>' : '') +
          '<span class="px-plain">' + esc(PLAIN_LABELS[n.type] || n.type) + '</span>' +
          '<span class="px-tech">' + esc(deviceName(n.type)) + '</span></li>';
      });
      return html + '</ol>';
    }

    function summaryInline(chain) {
      return chain.map(function (n) { return esc(PLAIN_LABELS[n.type] || n.type); }).join(' · ');
    }

    function stateMarker() {
      if (state.sound === 'unsaved') return '<span class="px-cs-state">· unsaved changes</span>';
      if (state.sound === 'custom') return '<span class="px-cs-state">· built by your agent</span>';
      return '';
    }

    function saveButton() {
      // "Save this sound" appears ONLY for an unsaved sound (settled).
      if (state.sound === 'preset') return '';
      return '<button type="button" class="px-save" data-action="save">Save this sound</button>';
    }

    function transport() {
      var list = filteredFactory();
      var pos = list.indexOf(state.current);
      var label = list.length === 0 ? '–' : (pos < 0 ? '·' : (pos + 1) + ' / ' + list.length);
      return '<div class="px-transport">' +
        '<button type="button" class="control" data-action="prev"' + (list.length < 2 ? ' disabled' : '') + '>◀ Previous</button>' +
        '<span class="px-pos">' + label + '</span>' +
        '<button type="button" class="control" data-action="next"' + (list.length < 2 ? ' disabled' : '') + '>Next ▶</button>' +
        '</div>';
    }

    function meterUnit(side, levelDb) {
      return '<div class="canvas-footer canvas-footer-' + side + '">' +
        '<span class="canvas-footer-legend">' + (side === 'in' ? 'MIC IN' : 'OUT') + '</span>' +
        '<div class="meter-unit canvas-footer-unit">' +
          '<canvas class="px-meter" data-level="' + levelDb + '"></canvas>' +
          '<div class="meter-readout">' + levelDb.toFixed(1) + '</div>' +
          '<span class="sr-only">' + (side === 'in' ? 'Input' : 'Output') + ' level</span>' +
        '</div></div>';
    }

    function metersMini() {
      return '<div class="px-meters">' + meterUnit('in', -15.4) + meterUnit('out', -8.7) + '</div>';
    }

    // ------------------------------------------------------------------
    // VARIANT A — Sidebar library · sound stage. The library takes the
    // presets sidebar's seat; Current sound takes the board's seat with
    // the meters framing it above and below, exactly where the chain
    // face keeps them today.
    // ------------------------------------------------------------------

    function variantA() {
      return shellOpen() +
        '<div class="layout voice-deck px-shellA">' +
          '<div class="panel px-lib">' +
            '<div class="panel-head"><h3 class="panel-label">Sounds</h3></div>' +
            '<div class="px-lib-body">' +
              chipsRow(true) +
              searchInput() +
              cardsGrid() +
            '</div>' +
          '</div>' +
          '<div class="voice-deck-face px-faceA">' +
            meterUnit('in', -15.4) +
            '<div class="px-stage">' +
              '<div class="px-stage-inner">' +
                '<div class="px-kicker">Current sound</div>' +
                '<div class="px-stage-head">' +
                  '<div class="px-cs-name">' + esc(currentName()) + stateMarker() + '</div>' +
                  saveButton() +
                '</div>' +
                (currentDescription() ? '<p class="px-desc">' + esc(currentDescription()) + '</p>' : '') +
                summaryList(currentChain(), true) +
                transport() +
              '</div>' +
            '</div>' +
            meterUnit('out', -8.7) +
          '</div>' +
        '</div></div>';
    }

    // ------------------------------------------------------------------
    // VARIANT B — Now-playing band. Current sound is a full-width band
    // directly under the system deck, carrying the meters inside it;
    // the library fills everything below as a wide card grid.
    // ------------------------------------------------------------------

    function variantB() {
      var chain = currentChain();
      var inline = summaryInline(chain);
      if (inline.length > 90) inline = inline.slice(0, 90).replace(/ ·[^·]*$/, '') + ' ·…';
      return shellOpen() +
        '<div class="layout voice-deck px-shellB">' +
          '<div class="px-band' + (state.expanded ? ' px-expanded' : '') + '">' +
            transport() +
            '<div class="px-band-info">' +
              '<div class="px-band-name-row">' +
                '<div class="px-cs-name">' + esc(currentName()) + stateMarker() + '</div>' +
                saveButton() +
                '<button type="button" class="px-dock-expand" data-action="expand" title="Show the whole effect summary" aria-expanded="' + state.expanded + '">' + (state.expanded ? '▴' : '▾') + '</button>' +
              '</div>' +
              '<div class="px-band-summary">' + inline + '</div>' +
              '<div class="px-band-more">' + summaryList(chain) + '</div>' +
            '</div>' +
            metersMini() +
          '</div>' +
          '<div class="panel px-libzone">' +
            '<div class="px-lib-toolbar">' + chipsRow(true) + searchInput() + '</div>' +
            cardsGrid() +
          '</div>' +
        '</div></div>';
    }

    // ------------------------------------------------------------------
    // VARIANT C — Library page · bottom dock. The library IS the Simple
    // view; Current sound docks to the bottom edge (thumb country on a
    // phone), summary expanding on demand.
    // ------------------------------------------------------------------

    function variantC() {
      return shellOpen() +
        '<div class="layout voice-deck px-shellC">' +
          '<div class="panel px-libpage">' +
            '<div class="px-lib-toolbar">' + chipsRow(true) + searchInput() + '</div>' +
            cardsGrid() +
          '</div>' +
          '<div class="px-dock' + (state.expanded ? ' px-expanded' : '') + '">' +
            '<div class="px-dock-row">' +
              transport() +
              '<div class="px-dock-info">' +
                '<div class="px-cs-name">' + esc(currentName()) + '</div>' +
                stateMarker() +
                saveButton() +
              '</div>' +
              metersMini() +
              '<button type="button" class="px-dock-expand" data-action="expand" title="Show the whole effect summary" aria-expanded="' + state.expanded + '">' + (state.expanded ? '▾' : '▴') + '</button>' +
            '</div>' +
            '<div class="px-dock-more">' + summaryList(currentChain()) + '</div>' +
          '</div>' +
        '</div></div>';
    }

    // ------------------------------------------------------------------
    // MODE PLUMBING — variant switching, mobile reading, the bar.
    // ------------------------------------------------------------------

    var builders = { A: variantA, B: variantB, C: variantC };

    function buildShell(id) {
      return builders[id]();
    }

    function barStatus() {
      var list = filteredFactory();
      var pos = list.indexOf(state.current);
      return esc(currentName()) + ' · filter ' + filterDef().label +
        ' · ' + list.length + ' factory results · card ' + (pos < 0 ? '–' : pos + 1) +
        ' · sound: ' + state.sound + (state.savedCount ? ' · saved ' + state.savedCount + ' to Yours' : '');
    }

    var barNote = '';

    function renderBar() {
      var vb = state.variant;
      var title;
      if (vb === 'all') {
        title = '<b>all</b> three side by side (static — pick a letter to interact)';
      } else {
        var v = VARIANTS.filter(function (x) { return x.id === vb; })[0];
        title = '<b>' + v.id + '</b> ' + v.name;
      }
      var el = document.getElementById('px-bar');
      if (el) el.remove();
      el = document.createElement('div');
      el.id = 'px-bar';
      el.className = 'px-bar';
      el.innerHTML =
        '<button type="button" data-action="step" data-dir="-1" title="Previous variant (←)">◀</button>' +
        '<div class="px-bar-title">' + title + '</div>' +
        '<button type="button" data-action="step" data-dir="1" title="Next variant (→)">▶</button>' +
        '<div class="px-bar-sep"></div>' +
        '<button type="button" data-action="vp" data-id="desktop" class="' + (state.vp === 'desktop' ? 'px-on' : '') + '">Desktop</button>' +
        '<button type="button" data-action="vp" data-id="mobile" class="' + (state.vp === 'mobile' ? 'px-on' : '') + '">Mobile</button>' +
        '<div class="px-bar-sep"></div>' +
        '<button type="button" data-action="sound" data-id="preset" class="' + (state.sound === 'preset' ? 'px-on' : '') + '">Preset</button>' +
        '<button type="button" data-action="sound" data-id="unsaved" class="' + (state.sound === 'unsaved' ? 'px-on' : '') + '">Unsaved</button>' +
        '<button type="button" data-action="sound" data-id="custom" class="' + (state.sound === 'custom' ? 'px-on' : '') + '">Custom</button>' +
        '<div class="px-bar-sep"></div>' +
        '<div class="px-bar-note">' + (barNote || barStatus()) + '</div>';
      document.body.appendChild(el);
    }

    function effectiveMobile() {
      return state.vp === 'mobile' || window.matchMedia('(max-width: 900px)').matches;
    }

    function render() {
      var root = document.getElementById('px-root');
      var active = document.activeElement;
      var refocus = active && active.id === 'px-search';
      var rootHtml;

      document.documentElement.classList.toggle('px-all', state.variant === 'all');
      document.documentElement.classList.toggle('px-mob', effectiveMobile());
      document.documentElement.classList.toggle('px-bypassed', state.bypass);

      if (state.variant === 'all') {
        rootHtml = '<div class="px-allrow">';
        VARIANTS.forEach(function (v) {
          rootHtml += '<div class="px-allcard' + (state.vp === 'mobile' ? ' px-allmob' : '') + '">' +
            '<div class="px-allcard-label"><b>' + v.id + '</b> — ' + v.name + '</div>' +
            (state.vp === 'mobile'
              ? '<div class="px-frame" style="margin:0">' + buildShell(v.id) + '</div>'
              : '<div class="px-scaled">' + buildShell(v.id) + '</div>') +
            '</div>';
        });
        rootHtml += '</div>';
      } else if (effectiveMobile()) {
        rootHtml = '<div class="px-frame">' + buildShell(state.variant) + '</div>';
      } else {
        rootHtml = buildShell(state.variant);
      }

      root.innerHTML = rootHtml;
      drawMeters();
      renderBar();

      if (refocus) {
        var again = document.getElementById('px-search');
        if (again) {
          again.focus();
          var vlen = again.value.length;
          again.setSelectionRange(vlen, vlen);
        }
      }
      writeUrl();
    }

    function writeUrl() {
      var p = new URLSearchParams();
      p.set('variant', state.variant);
      if (state.vp === 'mobile') p.set('vp', 'mobile');
      history.replaceState(null, '', location.pathname + '?' + p.toString());
    }

    // ------------------------------------------------------------------
    // METERS — static lamp bars in the real meter vocabulary. Fixed
    // representative levels (this prototype answers arrangement, not
    // ballistics).
    // ------------------------------------------------------------------

    function drawMeters() {
      var dpr = window.devicePixelRatio || 1;
      document.querySelectorAll('canvas.px-meter').forEach(function (cv) {
        var cssW = cv.clientWidth || 96;
        cv.width = Math.round(cssW * dpr);
        cv.height = Math.round(26 * dpr);
        var ctx = cv.getContext('2d');
        var level = parseFloat(cv.getAttribute('data-level')) || -18;
        var segs = 22;
        var gap = 2 * dpr;
        var segW = (cv.width - gap * (segs - 1)) / segs;
        for (var i = 0; i < segs; i++) {
          var segDb = -54 + (54 / (segs - 1)) * i;
          var lit = level >= segDb;
          var color = lit
            ? (segDb > -6 ? '#e4574a' : segDb > -18 ? '#ffd75e' : '#4ea96b')
            : '#262933';
          ctx.fillStyle = color;
          ctx.fillRect(i * (segW + gap), 3 * dpr, segW, cv.height - 6 * dpr);
        }
      });
    }

    // ------------------------------------------------------------------
    // EVENTS — one delegated click handler; search keeps focus across
    // re-renders.
    // ------------------------------------------------------------------

    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var act = btn.getAttribute('data-action');
      barNote = '';

      if (act === 'step') {
        var order = ['A', 'B', 'C', 'all'];
        var i = order.indexOf(state.variant);
        state.variant = order[(i + parseInt(btn.getAttribute('data-dir'), 10) + order.length) % order.length];
      } else if (act === 'vp') {
        state.vp = btn.getAttribute('data-id');
      } else if (act === 'chip') {
        state.filter = btn.getAttribute('data-id');
      } else if (act === 'try') {
        var p = FACTORY[parseInt(btn.getAttribute('data-i'), 10)];
        if (p) { state.current = p; state.sound = 'preset'; state.expanded = false; }
      } else if (act === 'prev' || act === 'next') {
        var list = filteredFactory();
        if (list.length) {
          var pos = list.indexOf(state.current);
          var stepIdx;
          if (pos < 0) {
            stepIdx = act === 'next' ? 0 : list.length - 1;
          } else {
            stepIdx = (pos + (act === 'next' ? 1 : -1) + list.length) % list.length;
          }
          state.current = list[stepIdx];
          state.sound = 'preset';
          state.expanded = false;
        }
      } else if (act === 'sound') {
        state.sound = btn.getAttribute('data-id');
      } else if (act === 'save') {
        state.savedCount += 1;
        var saved = { name: 'My Sound ' + state.savedCount, description: 'Saved from the Simple view prototype.', user: true };
        USERS.push(saved);
        state.current = saved;
        state.sound = 'preset';
        barNote = 'Saved to Yours (mock — nothing persists across reload)';
      } else if (act === 'expand') {
        state.expanded = !state.expanded;
      } else if (act === 'advanced') {
        barNote = 'View switching is #47\'s task — this prototype only arranges Simple';
      } else if (act === 'noop') {
        return;
      }

      render();
    });

    // The Bypass key carries no data-action in the shared markup (it
    // reuses the production id), so give delegation a direct hook:
    document.addEventListener('click', function (e) {
      if (e.target.id === 'bypass-toggle-button') {
        state.bypass = !state.bypass;
        render();
      }
    });

    document.addEventListener('input', function (e) {
      if (e.target.id === 'px-search') {
        state.query = e.target.value;
        var root = document.getElementById('px-root');
        // Re-render but let the focus-restore path in render() handle
        // caret position.
        render();
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.target.matches('input, textarea, [contenteditable]')) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var order = ['A', 'B', 'C', 'all'];
      var i = order.indexOf(state.variant);
      state.variant = order[(i + (e.key === 'ArrowRight' ? 1 : -1) + order.length) % order.length];
      render();
    });

    window.addEventListener('resize', function () {
      drawMeters();
      document.documentElement.classList.toggle('px-mob', effectiveMobile());
    });

    // ------------------------------------------------------------------
    // BOOT
    // ------------------------------------------------------------------

    (function init() {
      var p = new URLSearchParams(location.search);
      var v = p.get('variant');
      if (v && (builders[v] || v === 'all')) state.variant = v;
      if (p.get('vp') === 'mobile' || p.get('vp') === 'desktop') state.vp = p.get('vp');
      render();
    })();
  })();
  </script>
</body>
</html>
