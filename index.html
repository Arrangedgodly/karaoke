<body>
  <!--
    ================================================================
    DIRECTION CONTRACT — Pattern Machine / Single Face Chassis
    (redesign 2026-08-30; docs/ultron/redesign.md)

    THESIS: a groovebox's encoder field — knob clusters per module,
    pads for discrete choices, one display line answering the held
    control.

    OWN-WORLD: matte near-black chassis; silkscreen print; signal orange
    reserved for system states (register marks, focus, live blink, Start)
    — knob arcs carry each section's family color (item 1 adjustment,
    amending the one-accent economy to family-coded controls); dot-matrix
    register; family print; one disabled texture (hatch); the touched
    section lifts — never glow.

    STORY: the operator plays the chain as an instrument face; every
    touch answers on the display line and in the PA; plain-language
    help survives verbatim.

    FIRST VIEWPORT (item 1b, Two-Deck Stack): one full-width instrument
    — a slim SYSTEM DECK (identity print, engine lamp, RATE/LAT/NODES
    dot-matrix etch, agent reporter, the one orange Start key, BYPASS as
    the red-ringed end key) joined by a MACHINED SEAM — the deepest cut
    on the page — to the VOICE DECK, one faceplate whose palette strip,
    chain face (display register top edge; MIC IN jack print top-left;
    sections split by machined grooves; OUT jack + VU corner
    bottom-right) and presets strip read as printed zones split by the
    same grooves. Below 900px the etch wraps to a second row and the
    voice deck stacks palette | face | presets.

    FORM: Pattern Machine; direction seed 2a361f1b; surface deal seed
    2e642e38, dealt 4/7/3, locked Single Face Chassis; code-led.

    FINISH: unreviewed and undocumented is unfinished; this build ends
    with the finish review, the verdict, DESIGN.md, and every shipping
    raster carrying its provenance.
    ================================================================
  -->
  <!--
    ================================================================
    ITEM 1b — the TWO-DECK STACK (redesign item 1b; locked card
    `two-deck-stack`, .impeccable/decision-surface-1b-payload.json).
    The whole viewport is ONE instrument: .instrument is the outer
    chassis shell; the SYSTEM DECK is the old VIS-2 status strip
    re-cast as the upper slab (class .topbar retained verbatim — it is
    src/agent-ui.js's chip mount); .deck-seam is the machined joint
    between the two slabs (dark cut under a light lip — the deepest
    cut on the page, deeper and wider than the section grooves); the
    VOICE DECK is #chain-layout re-cast as the lower slab (class
    .voice-deck added alongside .layout), one faceplate whose palette
    zone, chain face and presets zone are printed zones split by the
    same groove grammar the canvas sections use. Structure-only
    additions: .instrument, .deck-seam, .system-etch (the deck's
    dot-matrix etch wrapping the lamp + RATE/LAT/NODES readouts so the
    <900px rule can wrap that group — and only that group — to a
    second row). No element was removed, renamed, or reordered.

    All wiring contracts below survive byte-for-byte: .topbar +
    #bypass-toggle-button as its DIRECT last child (the agent chip's
    insertion point), every id the three UI scripts resolve, the
    persistence keys, the SortableJS lists, and the engine-not-started
    gate class on #chain-layout.
    ================================================================
  -->
  <!--
    ================================================================
    VIS-2 — the topbar as the console's STATUS LCD STRIP, per
    .impeccable/surfaces/index-html.md (the committed world: status-strip
    discipline donated by broadcast rack gear's dense status displays).
    Restyled by item 1b into the Pattern Machine SYSTEM DECK (see the
    block above; styles/main.css owns the current vocabulary).

    One persistent full-width strip, left to right: identity legend
    (h1, copy verbatim) · engine-state block · machine readout group
    (sample rate / latency / node count) · Start + device controls ·
    Bypass at the far right. The readout ids
    (#readout-sample-rate / #readout-latency / #readout-node-count) are
    wired by FEW-2; their labels (RATE / LATENCY / NODES) are new
    terse-technical copy on new elements, not changes to existing copy.

    Every pre-existing id/class survives verbatim (.topbar, .app-title,
    #status + #status-dot/#status-text, .control, #start-button, the
    sr-only label + #input-device-select, #bypass-toggle-button /
    .bypass-btn), so src/main.js wiring needed no change; the
    .topbar-section / .readout wrappers are structural ADDITIONS
    only — no element was removed or renamed.

    UI-2's emergency Bypass contract is honored unchanged: audio
    routing stays AE-3's window.AudioBypass (src/audio-bypass.js), the
    `engaged` class + "Bypass: ON/OFF" text stay toggled in lockstep by
    src/main.js, and the button stays a DIRECT child of .topbar (the
    last one), so FEW-1's agent chip (src/agent-ui.js) still inserts
    immediately before it. The CSS keeps it the deck's single loudest
    element (split-role safety red: red-edge ring at rest, red-fill +
    white when engaged — see styles/main.css).
    ================================================================
  -->
  <div class="instrument">
  <header class="topbar system-deck">
    <div class="topbar-section topbar-identity">
      <h1 class="app-title">VOXCHAIN</h1>
    </div>

    <div class="system-etch">
    <div class="topbar-section topbar-status">
      <!--
        Refinement entry 3 ($impeccable harden, 2026-08-28): the strip's
        state sentence (Live / Stopped / operator error copy) announces to
        assistive tech via role="status" + aria-live="polite" on the
        EXISTING #status element — previously only the agent-toast region
        announced, so "Live"/failure transitions were silent (critique
        P1 #3). The demoted technical footnote span (.status-detail)
        inside #status-text is created by src/main.js at failure time.
      -->
      <span class="status" id="status" role="status" aria-live="polite">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Stopped</span>
      </span>
    </div>

    <div class="readout-group" role="group" aria-label="Engine readouts">
      <span class="readout">
        <span class="readout-label">RATE</span>
        <span class="readout-value" id="readout-sample-rate">—</span>
      </span>
      <span class="readout">
        <span class="readout-label">LATENCY</span>
        <span class="readout-value" id="readout-latency">—</span>
      </span>
      <span class="readout">
        <span class="readout-label">NODES</span>
        <span class="readout-value" id="readout-node-count">—</span>
      </span>
    </div>
    </div>

    <div class="topbar-section topbar-controls">
      <!--
        Refinement entry 2 ($impeccable clarify, 2026-08-28): the strip's
        one visible pre-Start instruction, anchored to Start via
        aria-describedby. It must sit AFTER the button in DOM order so CSS
        can key its visibility off the button's own disabled state
        (#start-button:disabled ~ .start-hint in styles/main.css): Start is
        disabled synchronously during the mic request and stays disabled
        once the engine is live, and src/main.js re-enables it only on
        failure — so the line shows exactly while pressing Start is the
        true next action, with zero extra JS. Its copy matches the
        pre-Start #empty-hint line below (same instruction, two anchors).
      -->
      <button id="start-button" class="control" type="button" aria-describedby="start-hint">Start</button>
      <span class="start-hint" id="start-hint">Press Start to power on</span>

      <label for="input-device-select" class="sr-only">Input device:</label>
      <select id="input-device-select" class="control" disabled>
        <option value="">-- click Start to list devices --</option>
      </select>
    </div>

    <button id="bypass-toggle-button" class="bypass-btn" type="button" disabled>Bypass: OFF</button>
  </header>

  <!-- The machined deck seam (item 1b): the joint that bolts the two
       slabs into one chassis — a 1px light lip over a deep dark cut,
       deeper and wider than any section groove on the voice deck.
       Purely decorative geometry; aria-hidden, no focus, no content. -->
  <div class="deck-seam" aria-hidden="true"></div>

  <!--
    ================================================================
    UI-3 — palette + chain canvas, restructured by redesign item 1 into
    the SINGLE FACE CHASSIS (the direction contract comment above is the
    binding world; src/canvas.js + src/param-controls.js + the Pattern
    Machine block of styles/main.css build it).

    The .canvas markup below is the FLOW SEQUENCE (unchanged DOM): MIC IN
    anchor → arrow → #chain-list → #empty-hint → arrow → OUT anchor. The
    chrome around it is JS-built panel furniture: the DISPLAY REGISTER
    (src/canvas.js, panel's first child — the accent-marked top-edge
    line) and the pinned OUT footer mirror + VU corner (src/meters.js,
    the base plate). Each chain entry is a panel-print SECTION built by
    src/canvas.js (family print rail + encoder field, split by machined
    grooves — see that file's createNodeCard block); its controls (knob
    clusters, pad selectors, trim sliders) are src/param-controls.js.

    VIS-5/FEW-3 contract preserved verbatim: src/meters.js finds the two
    .anchor elements by their EXACT text ("MIC IN" / "OUT") and mounts
    the meter units inside them — the anchors below must stay text-only.

    The whole region starts visually gated (`engine-not-started` class —
    the hatch + recede grammar in main.css) until AudioEngine.start()
    succeeds; src/canvas.js's onEngineStarted() removes the class, flips
    the empty-hint copy, and wakes the display register, while its
    onSort/remove handlers separately guard on
    window.AudioEngine.isStarted before ever calling AudioGraph.build
    Graph(), so no drag completed before Start can throw either way.
    ================================================================
  -->
  <!-- VOICE DECK (item 1b): #chain-layout re-cast as the lower slab —
       class .voice-deck added alongside .layout; the engine-not-started
       gate class and id are the wiring contracts, unchanged. -->
  <div class="layout voice-deck engine-not-started" id="chain-layout">
    <div class="panel palette">
      <h2>Palette</h2>
      <div class="palette-list" id="palette-list"></div>
    </div>

    <div class="panel canvas-panel">
      <div class="canvas" id="chain-canvas">
        <div class="anchor">MIC IN</div>
        <span class="arrow" aria-hidden="true">→</span>
        <div class="chain-list" id="chain-list"></div>
        <!--
          Refinement entry 2: the empty-hint is STATE-AWARE. This static
          default is the PRE-START copy — the palette is pointer-locked
          until Start succeeds, so teaching "drag" here would be an
          invitation the gated surface cannot honor (critique P2).
          src/canvas.js's onEngineStarted() flips this element to the
          cycle-1 drag teaching copy ("Drag an effect here to start
          building your chain", verbatim) at the exact transition where
          dragging becomes possible; styles/main.css retires the dashed
          drop-target affordance while the engine-not-started gate holds.
        -->
        <div class="empty-hint" id="empty-hint">Press Start to power on</div>
        <span class="arrow" aria-hidden="true">→</span>
        <div class="anchor">OUT</div>
      </div>
    </div>

    <!--
      PS-3 — real, third Presets column, per the approved PX-1 mockup's
      3-column layout (docs/ultron/design/px1-mockup.html's .presets/
      .preset-name/.unsaved-dot classes are the styling source of truth —
      see styles/main.css). Wired up by src/presets-ui.js to
      window.PresetStore (src/preset-store.js, N named saved presets) and
      window.ChainCanvas (loadModel()/getCurrentModel()). Sibling of
      .palette/.canvas-panel above, so it's gated by the same
      `engine-not-started` class on #chain-layout — no extra JS wiring
      needed for that (see styles/main.css's `.layout.engine-not-started`
      rule, extended to include `.presets`).
    -->
    <div class="panel presets">
      <h2>Presets</h2>
      <div class="preset-current">
        <span id="current-preset-name" class="preset-name">Unsaved chain</span>
        <span id="unsaved-indicator" class="unsaved-dot" style="display:none;">• unsaved changes</span>
      </div>
      <button id="save-preset-btn" class="control" type="button">Save As…</button>
      <label for="preset-select" class="sr-only">Saved presets</label>
      <select id="preset-select" class="control"><option value="">-- no presets --</option></select>
      <div class="preset-actions">
        <button id="load-preset-btn" class="control" type="button">Load</button>
        <button id="delete-preset-btn" class="control" type="button">Delete</button>
      </div>
    </div>
  </div>
  </div>

  <script src="src/audio-engine.js"></script>
  <script src="src/audio-graph.js"></script>
  <script src="src/audio-bypass.js"></script>
  <script src="src/node-types.js"></script>
  <!--
    Issue #5 — shared click-safe AudioParam scheduling
    (window.AudioParamRamp, src/audio-param-ramp.js): the ONE ramp every
    live AudioParam write by the node handlers below funnels through
    (cancel + setValueAtTime + linearRampToValueAtTime over 15 ms — the
    house pattern audio-graph.js's rampGateTo() established), making the
    'host-param-ramps' capability promise true. Loads BEFORE the six
    node-*.js files whose applyParam handlers call
    AudioParamRamp.schedule(); needs nothing itself at parse time.
  -->
  <script src="src/audio-param-ramp.js"></script>
  <!--
    Tone.js 15.1.22 (UMD build, vendored — no build step, same constraint as
    vendor/sortable.min.js). Exposes window.Tone. Loaded before the node
    files so Tone-backed types (registered via src/tone-adapter.js) can reach
    it; nothing touches Tone at parse time — node files only REGISTER, and
    Tone is first used at graph-build time (always after a user gesture).
    The app's own AudioContext stays authoritative: the adapter calls
    Tone.setContext(audioContext) so Tone nodes live on the same context as
    the mic source, chain gate, bypass tap, and meters.
  -->
  <script src="vendor/tone.min.js"></script>
  <!--
    ToneAdapter (src/tone-adapter.js): one-call registration for Tone-backed
    node types — generates BOTH registry registrations (AudioGraph factory
    + NodeTypes metadata) around a Tone effect node wrapped in the AE-7
    native composite contract. Loads after vendor/tone.min.js and after both
    registries; the Tone effect files below (node-pitchshift.js etc.) call
    ToneAdapter.register() at parse time. Touches window.Tone only at
    factory time, never at registration time (harness safety).
  -->
  <script src="src/tone-adapter.js"></script>
  <script src="src/node-gain.js"></script>
  <script src="src/node-compressor.js"></script>
  <script src="src/node-eq.js"></script>
  <script src="src/node-delay.js"></script>
  <script src="src/node-reverb.js"></script>
  <script src="src/node-limiter.js"></script>
  <script src="src/node-distortion.js"></script>
  <script src="src/node-chorus.js"></script>
  <!--
    GATE-1: the noise gate's registration shim. Its DSP lives in
    src/gate-worklet.js, which is NOT a script tag — it is fetched via
    audioContext.audioWorklet.addModule('src/gate-worklet.js') from inside
    src/node-gate.js (the same loading convention as the issue #7 watchdog
    worklet). Palette chip appears automatically via
    NodeTypes.getAllTypes() (src/canvas.js).
  -->
  <script src="src/node-gate.js"></script>
  <!--
    AT-1: the autotune's registration shim, on the AT-0 spike's HARD-TUNE
    PASS verdict (research/at0-spike-result.md). Its DSP (YIN detection +
    TD-PSOLA shifting + scale snap, one engine for hard-tune and slow
    retune) lives in src/autotune-worklet.js, which is NOT a script tag —
    it is fetched via audioContext.audioWorklet.addModule() from inside
    src/node-autotune.js (the gate/watchdog worklet loading convention).
    Key/Scale are UI-1's discrete string selects, mapped to the worklet's
    numeric enums in node-autotune.js. Experimental per the cycle-3 scope:
    the node card carries a badge (minimal version in src/canvas.js; the
    formal badge component is UI-2's).
  -->
  <script src="src/node-autotune.js"></script>
  <!--
    Tone-backed effects (cycle 4): each file is ONE ToneAdapter.register()
    call — the adapter (src/tone-adapter.js) builds both registry
    registrations around a vendor/tone.min.js (Tone.js 15.1.22) effect
    node. Palette chips, MCP add_node enum entries, set_param validation,
    and preset persistence all pick these up automatically from the live
    NodeTypes registry. Experimental until the ACCEPTANCE.md listening
    pass signs off (same badge mechanism as autotune, cycle 3).
  -->
  <script src="src/node-pitchshift.js"></script>
  <script src="src/node-tremolo.js"></script>
  <script src="src/node-bitcrusher.js"></script>
  <script src="src/node-phaser.js"></script>
  <script src="src/param-controls.js"></script>
  <script src="src/preset-schema.js"></script>
  <script src="src/default-preset.js"></script>
  <!--
    PS-4 — factory preset library (window.FactoryPresets,
    src/factory-presets.js): the six shipped starting points (Classic
    Karaoke + the five QA-3 acceptance chains, content verbatim from
    docs/ultron/qa/qa3-driver.js). Static runtime content, loaded here
    right after default-preset.js — BEFORE preset-store.js/presets-ui.js/
    mcp-tools.js, its three consumers — and never persisted: the preset
    dropdown merges it at runtime (Factory/Yours optgroups), so a fresh
    profile sees the full library with zero localStorage seeding and
    PresetStore's user namespace is untouched.
  -->
  <script src="src/factory-presets.js"></script>
  <script src="src/preset-store.js"></script>
  <!--
    DEL-2: vendored locally (vendor/sortable.min.js, SortableJS 1.15.7, MIT)
    instead of loaded from a CDN — this app is meant to run at
    locally-hosted events with no internet dependency assumed (see DEL-1's
    own acceptance criteria), and a CDN script tag would silently break
    drag-and-drop at any venue without a live internet connection.
  -->
  <script src="vendor/sortable.min.js"></script>
  <script src="src/canvas.js"></script>
  <script src="src/persistence.js"></script>
  <!--
    FEW-1: shared agent-feedback event contract + unstyled DOM skeletons
    (window.AgentUI, src/agent-ui.js) — lifecycle state, mutation-summary
    toasts, and the undo stack that both later cycle-2 tracks (the WebMCP
    shim and the console re-skin) code against. Standalone: no
    dependencies on any other script and no WebMCP logic — it creates its
    own #agent-chip / #agent-toast-region at runtime.
  -->
  <script src="src/agent-ui.js"></script>
  <!--
    WebMCP registration adapter: detects the top-level page's imperative
    API and registers definitions supplied by src/mcp-tools.js. Despite
    the historical filename, this is browser code, not an MCP server or
    transport. Loads after agent-ui.js so tool activity can drive the
    shared status chip.
  -->
  <script src="src/mcp-server.js"></script>
  <!--
    The 10 production WebMCP tool definitions (window.McpTools): schemas,
    validation, read operations, policy-checked mutations, visible
    summaries, and Undo. Loads after mcp-server.js and self-registers at
    top level through the adapter. The node-*.js files above are already
    loaded, so schemas and validation use the live node registry.
  -->
  <script src="src/mcp-tools.js"></script>
  <!--
    MC-6 — dev test harness (agent simulator): a fixed right-side overlay
    panel (src/mcp-harness.js, built entirely from JS — no markup here)
    that lists all 10 tools from McpTools.getDefs() with editable JSON
    args and Run buttons invoking def.execute() DIRECTLY (defs-direct
    path — works with WebMCP absent; the portfolio agent-free demo), plus
    an agentui:* event stream and a real AgentUI undo bar. ?dev GATED:
    the module activates only when location.search contains 'dev' (e.g.
    http://localhost:8000/?dev); without the param it is one cheap
    string parse and nothing else — zero elements, listeners or exports.
    Pure consumer: never registers anything with McpServer; zero
    localStorage (reload resets). Close/Escape hides the panel for this
    load only — reopen by reloading with ?dev.
  -->
  <script src="src/mcp-harness.js"></script>
  <script src="src/presets-ui.js"></script>
  <!--
    VIS-5 — MIC IN / OUT level meters (window.Meters, src/meters.js):
    canvas lamp-bar meter components created from JS at the two .anchor
    labels (matched by their exact text, "MIC IN" / "OUT"), pure visual +
    ballistics with ZERO Web Audio in this file — all rq4 ballistics
    (12 dB/s falls, 50 ms RMS, 1500 ms peak-hold, 2 s clip latch) live
    inside the component. FEW-3 owns the AnalyserNode side-taps (IN off
    AudioEngine.sourceNode, OUT off AudioGraph.getChainGate()) and drives
    both meters per frame via Meters.feed('in'|'out', {peakDb, rmsDb,
    clipRun}) — the authoritative contract block is at the top of
    src/meters.js. Until FEW-3 calls Meters.setEngineState(true), the
    meters render silent-at-rest dark: scale visible, bars empty,
    readout −∞. Loads after the DOM it annotates and before main.js,
    which runs last by house convention.
  -->
  <script src="src/meters.js"></script>
  <!--
    FEW-3 — meter wiring + runtime watchdog (window.MeterTaps,
    src/meter-taps.js): the two AnalyserNode side-taps rq4-meters.md
    committed (IN off AudioEngine.sourceNode, OUT off the persistent
    chainGate — created once per session, outside buildGraph()) plus
    the ONE shared rAF loop that feeds Meters both sides every frame
    and runs the RQ-3 watchdog on the shared OUT analyser (peak above
    the derived OUTPUT_CEILING_DBFS threshold sustained >250 ms, or a
    ~1 s monotonic 1–8 kHz band rise → chainGate force-muted, alert +
    human-only Restore). src/main.js calls the three lifecycle hooks
    (onEngineStarted / onEngineStopped / onDeviceSwitched). Must load
    after meters.js (it drives the Meters contract) and before main.js.
  -->
  <script src="src/meter-taps.js"></script>
  <!--
    FEW-2 — status readout wiring (window.StatusReadouts,
    src/status-readouts.js): feeds the VIS-2 readout slots in the topbar
    (#readout-sample-rate / #readout-latency / #readout-node-count)
    their real values — RATE and LATENCY once per engine start (off
    AudioEngine's live AudioContext; latency is the context-REPORTED
    base+output estimate), NODES at 1 Hz off ChainCanvas's live model.
    Entirely hook-driven: nothing runs until src/main.js's Start success
    handler calls StatusReadouts.onEngineStarted(), so its only ordering
    constraint is the house one — before main.js. Guarded consumer: a
    missing topbar element or a bad argument leaves it a harmless no-op.
  -->
  <script src="src/status-readouts.js"></script>
  <script src="src/main.js"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=ff754d30-76f8-417f-ae5c-209f190c0c99"></script>
